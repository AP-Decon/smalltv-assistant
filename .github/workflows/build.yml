name: Build firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: |
          # works whether the files are at the top level or inside a subfolder
          PROJ=$(dirname "$(find . -name platformio.ini -not -path './.pio/*' | head -n 1)")
          echo "Building in $PROJ"
          cd "$PROJ"
          pio run -e smalltv
          cp .pio/build/smalltv/firmware.bin "$GITHUB_WORKSPACE/smalltv-assistant.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: smalltv-assistant-firmware
          path: smalltv-assistant.bin

      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Firmware build ${{ github.run_number }}
          files: smalltv-assistant.bin

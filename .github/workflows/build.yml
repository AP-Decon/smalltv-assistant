name: Build firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: |
          # works whether the files are at the top level or inside a subfolder
          PROJ=$(dirname "$(find . -name platformio.ini -not -path './.pio/*' | head -n 1)")
          echo "Building in $PROJ"
          cd "$PROJ"
          pio run -e smalltv
          # SDPro clone firmware only accepts files whose name starts with "SDP"
          cp .pio/build/smalltv/firmware.bin "$GITHUB_WORKSPACE/SDPro_Assistant.bin"
          # compressed copy for updating over Wi-Fi (the cube unpacks it itself)
          gzip -9 -c .pio/build/smalltv/firmware.bin > "$GITHUB_WORKSPACE/SDPro_Assistant.bin.gz"
          ls -l "$GITHUB_WORKSPACE"/SDPro_Assistant.bin*

      # ---- ESP32-C2 ("SDC2") cube, built with ESPHome ----
      - name: Build ESP32-C2 version
        continue-on-error: true
        run: |
          pip install esphome
          PROJ=$(dirname "$(find . -name platformio.ini -not -path './.pio/*' | head -n 1)")
          cd "$PROJ"
          esphome compile c2/smalltv-c2.yaml
          OTA=$(find c2/.esphome -name 'firmware.ota.bin' | head -n 1)
          FACTORY=$(find c2/.esphome -name 'firmware.factory.bin' | head -n 1)
          [ -z "$OTA" ] && OTA=$(find c2/.esphome -name 'firmware.bin' | head -n 1)
          cp "$OTA" "$GITHUB_WORKSPACE/SDC2_Assistant.bin"
          [ -n "$FACTORY" ] && cp "$FACTORY" "$GITHUB_WORKSPACE/SDC2_Assistant_full_usb.bin"
          ls -l "$GITHUB_WORKSPACE"/SDC2_*

      - uses: actions/upload-artifact@v4
        with:
          name: smalltv-assistant-firmware
          path: |
            SDPro_Assistant.bin
            SDPro_Assistant.bin.gz
            SDC2_Assistant.bin
            SDC2_Assistant_full_usb.bin

      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Firmware build ${{ github.run_number }}
          files: |
            SDPro_Assistant.bin
            SDPro_Assistant.bin.gz
            SDC2_Assistant.bin
            SDC2_Assistant_full_usb.bin

; SmallTV Assistant - custom firmware for the GeekMagic SmallTV-Ultra
; (ESP-12F / ESP8266, ST7789 240x240 display)

[env:smalltv]
platform = espressif8266@^4.2.1
board = esp12e
framework = arduino
board_build.filesystem = littlefs
; Match the stock "SDPro" firmware's flash layout (1MB app / 3MB LittleFS at
; 0x100000-0x3FA000, found in SDPro_V1.0.6). Using the same layout means the
; stock photos, GIFs and web pages survive, so re-flashing the stock .bin
; later gives you a working clock again.
board_build.ldscript = eagle.flash.4m3m.ld
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17

; TFT_eSPI is configured here instead of editing its User_Setup.h.
; Pins come from the ESPHome device page for the GeekMagic Ultra.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_CS=-1
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_SPI_MODE=SPI_MODE3
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D PIN_BACKLIGHT=5
    -D FW_VERSION=\"1.1.0\"
